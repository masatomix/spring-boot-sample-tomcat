server.compression.enabled: true
server.compression.min-response-size: 1
server.port=8080

# JWT(Bearer トークン)検証の鍵取得元（task#1056 Step 2）。
# Firebase が発行する ID トークンの署名検証鍵（JWK Set）。旧 JWTUtils が参照していた
# X.509 証明書エンドポイントの JWK 版。jwk-set-uri 指定により JwtDecoder は遅延取得する
# （起動時・テスト時にはネットワークアクセスしない）。
# 注: 現状は署名・有効期限のみ検証（旧実装と同等）。issuer/audience の厳密検証を行う場合は
# プロジェクト ID を用いて issuer-uri を設定する（将来の改善）。
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://www.googleapis.com/service_accounts/v1/jwk/securetoken@system.gserviceaccount.com

# Actuator の公開は health / info のみに限定する（task#1056 Step 1）。
# 以前は `*`（全エンドポイント公開）+ env.show-values=ALWAYS で、/actuator/env や
# /actuator/heapdump 等から環境変数・メモリダンプが無認証で取得できる状態だった。
# 追加で必要なエンドポイントがある場合のみ、明示的に列挙して許可すること。
management.endpoints.web.exposure.include=health,info

# ※未検証・参考: Redis セッションを使う場合の設定。本サンプルでは無効化したまま残す。
# spring.session.store-type=redis
# # Redis server host.
# spring.data.redis.host=localhost
# # Login password of the redis server.
# # spring.data.redis.password=
# # Redis server port.
# spring.data.redis.port=6379

logging.level.nu=DEBUG
logging.level.org=INFO