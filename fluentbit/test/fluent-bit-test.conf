# ちなみに、Firelensとおして生ログを出してみたら
# {
#     "container_id": "a0391e86369f4d73b67e1130a7266449-0527074092",
#     "container_name": "app",
#     "ecs_cluster": "app-server-dev-20250815-cluster",
#     "ecs_task_arn": "arn:aws:ecs:ap-northeast-1:70604xxx0076932:task/app-server-dev-20250815-cluster/a0391e86369f4d73b67e1130a7266449",
#     "ecs_task_definition": "app-taskdefinition-dev-20250815:13",
#     "log": "{\"@timestamp\":\"2025-08-22T11:29:11.69885596Z\",\"@version\":\"1\",\"message\":\"/save.start\",\"logger_name\":\"nu.mine.kino.web.SessionController\",\"thread_name\":\"http-nio-8080-exec-9\",\"level\":\"DEBUG\",\"level_value\":10000}",
#     "source": "stdout"
# }
#こうなってた

# log部を抽出して、中のescapeされた文字列をあらためてJSON化
[FILTER]
    Name     parser
    Match    *-firelens-*
    Key_Name log
    Parser   json
    # Preserve_Key ON
    Reserve_Data ON

    # {"key3"=>"v3", "log"=>"{"key1":"v1","key2":"v2"}"} に対して
    # Preserve_Key On 該当キー(Key_Name)の元データ(=log)も残す  (パース対象フィールド("log")を残すかどうか)
    # Reserve_Data On 他のデータ(key3)も残す (元の他フィールド("key3")を残すかどうか)
    # OFF/OFF {"key1"=>"v1", "key2"=>"v2"}
    # ON/OFF  {"key1"=>"v1", "key2"=>"v2", "log"=>"{"key1":"v1","key2":"v2"}"} 
    # OFF/ON  {"key1"=>"v1", "key2"=>"v2", "key3"=>"v3"} // コレが一番多いか
    # ON/ON   {"key1"=>"v1", "key2"=>"v2", "key3"=>"v3", "log"=>"{"key1":"v1","key2":"v2"}"}
    # cf https://docs.fluentbit.io/manual/pipeline/filters/parser

# エラーログにタグ付け
# LogLevelのプロパティが、ERROR なやつだけタグを付け直す(trueにして複製)
[FILTER]
    Name          rewrite_tag
    Match         *-firelens-*
    # Rule          $level (ERROR|WARN) error-$container_id true
    Rule          $level (ERROR) error-$container_id true

# うまく動かない(escapeされていない文字が入ってくるため)
# [FILTER]
#     Name       nest
#     Match      *-firelens-*
#     Operation  lift
#     Nest_Under log

[OUTPUT]
    Name file
    Match error*
    Path /fluent-bit/etc/output_dir


